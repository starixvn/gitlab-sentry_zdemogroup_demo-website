stages:
  - build

include: 'before-script-docker.gitlab-ci.yml'

variables:
  PROJECT_ROOT_PATH: .
  DOCKER_IMAGE_PATH: nexcel/nexops/sample-website4
  DOCKER_FILE_PATH: ./
  DOCKER_FILE_NAME: Dockerfile.alpine-x64 #Dockerfile
  CONFIG_FILE_PATH: ./src
  CONFIG_FILE_NAME: configs
  CONFIG_FILE_EXTENSION: js

build_image:
  stage: build
  image: registry.nexdev.net:5050/docker/docker-engine/docker:20.10.7
  #before_script:
  #  - export TRIVY_VERSION=${TRIVY_VERSION:-0.25.0} #0.25.0 0.19.2
    #- export TRIVY_VERSION=$(wget -qO - "https://api.github.com/repos/aquasecurity/trivy/releases/latest" | grep '"tag_name":' | sed -E 's/.*"v([^"]+)".*/\1/')
   # - echo $TRIVY_VERSION
   # - wget --no-verbose https://registry.nexdev.net/docker/docker-engine/docker/-/raw/master/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz?inline=false -O - | tar -zxvf -
    #https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz
  allow_failure: true
  script:
    - docker login -u $DOCKER_REG_USERNAME -p $DOCKER_REG_PASSWORD $DOCKER_REG_URL
    - docker pull $CI_REGISTRY_IMAGE:latest || true
    - docker build
      --pull
      -f $DOCKER_FILE_PATH/$DOCKER_FILE_NAME
      --tag $CI_REGISTRY_IMAGE:$CI_REGISTRY_IMAGE_VERSION
      --cache-from $CI_REGISTRY_IMAGE:latest $DOCKER_FILE_PATH
    # Image report
    - ./trivy image --exit-code 0 --format template --template "@contrib/gitlab-codequality.tpl" -o gl-codeclimate-image.json $CI_REGISTRY_IMAGE:$CI_REGISTRY_IMAGE_VERSION
    # Filesystem report
    - ./trivy filesystem --security-checks config,vuln --exit-code 0 --format template --template "@contrib/gitlab-codequality.tpl" -o gl-codeclimate-fs.json .
    # Combine report
    - apk update && apk add jq
    - jq -s 'add' gl-codeclimate-image.json gl-codeclimate-fs.json > gl-codeclimate.json
    # Print report
    - ./trivy image --exit-code 0 --severity HIGH $CI_REGISTRY_IMAGE:$CI_REGISTRY_IMAGE_VERSION
    # Fail on severe vulnerabilities
    - ./trivy image --exit-code 1 --severity CRITICAL $CI_REGISTRY_IMAGE:$CI_REGISTRY_IMAGE_VERSION
    - docker push $CI_REGISTRY_IMAGE:$CI_REGISTRY_IMAGE_VERSION
    - docker tag $CI_REGISTRY_IMAGE:$CI_REGISTRY_IMAGE_VERSION $CI_REGISTRY_IMAGE:latest
    - docker push $CI_REGISTRY_IMAGE:latest
  cache:
    paths:
      - .trivycache/
  # Enables https://docs.gitlab.com/ee/user/application_security/container_scanning/ (Container Scanning report is available on GitLab EE Ultimate or GitLab.com Gold)
  artifacts:
    paths:
      - gl-codeclimate.json
    reports:
      codequality: gl-codeclimate.json